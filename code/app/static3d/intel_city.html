<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intel City — 3D ULPIN Twin</title>
  <style>
    :root {
      --panel: rgba(255,255,255,0.96);
      --border: #a8bfd4;
      --text: #1a2834;
      --text-dim: #5a6f80;
      --accent: #1f7a8c;
      --ok: #0d7a4f;
      --warn: #9a6b00;
      --bad: #a33a3a;
      --side: 380px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(120% 90% at 50% 0%, #c5ddf5 0%, #9ec4e8 45%, #7eafd6 100%);
    }
    #app { display: flex; width: 100vw; height: 100vh; }
    #wrap { position: relative; flex: 1; min-width: 0; height: 100%; }
    #loading {
      position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: inherit; color: #334; font-size: 14px;
    }
    #bar {
      width: min(280px, 70vw); height: 6px; border-radius: 99px; background: rgba(255,255,255,0.55);
      overflow: hidden; border: 1px solid var(--border);
    }
    #bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.15s ease; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 10; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      width: 300px; max-width: calc(100vw - 24px);
    }
    #hud h1 { font-size: 14px; margin: 0 0 6px; }
    #hud .sub { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
    #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #fff; cursor: pointer; color: var(--text);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:hover { border-color: var(--accent); }
    #badge {
      position: absolute; right: 12px; top: 12px; z-index: 10; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
      font-size: 11px; color: var(--text-dim); max-width: 280px;
    }
    #badge b { color: var(--accent); }
    kbd {
      display: inline-block; font-family: ui-monospace, monospace; font-size: 10px;
      background: #e8eef4; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
    }
    #tooltip {
      position: absolute; pointer-events: none; z-index: 15; display: none;
      background: rgba(255,255,255,0.97); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 280px;
    }
    #tooltip .t-owner { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
    #tooltip .t-ulpin { color: var(--accent); font-family: ui-monospace, monospace; font-size: 11px; margin-top: 2px; word-break: break-all; }
    #panel {
      width: var(--side); flex: none; background: #fff; border-left: 1px solid var(--border);
      overflow-y: auto; padding: 16px 18px; display: none;
    }
    #panel.open { display: block; }
    #panel h2 { font-size: 15px; margin: 0 0 4px; }
    #panel .close { float: right; color: var(--text-dim); cursor: pointer; font-size: 12px; text-decoration: none; }
    #panel .breadcrumb { font-size: 11px; color: var(--text-dim); margin: 0 0 10px; line-height: 1.55; clear: both; }
    #panel .breadcrumb b { color: var(--text); }
    #panel .ulpin {
      font-family: ui-monospace, monospace; color: var(--accent); font-size: 11.5px;
      margin-bottom: 12px; word-break: break-all; cursor: pointer;
    }
    #panel .owner { font-size: 15px; font-weight: 650; margin-bottom: 4px; }
    #panel .owner-id { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
    #panel .banner {
      font-size: 11.5px; background: #fff6e5; border: 1px solid #e6c98a; color: #7a5a10;
      border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.45;
    }
    #panel .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    #panel .stat { background: #eef5fa; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    #panel .stat .v { font-size: 14px; font-weight: 700; }
    #panel .stat .k { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
    #panel h3 {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.55px;
      color: var(--text-dim); margin: 14px 0 6px;
    }
    #panel .row { font-size: 12.5px; line-height: 1.55; margin-bottom: 6px; }
    #panel .row span { color: var(--text-dim); }
    #panel .badge {
      display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); background: #f3f7fb; text-transform: capitalize;
    }
    #panel .badge.ok { background: #e5f7ee; border-color: #9ed4b6; color: var(--ok); }
    #panel .badge.warn { background: #fff6e5; border-color: #e6c98a; color: var(--warn); }
    #panel .badge.bad { background: #fdeeee; border-color: #e3a8a8; color: var(--bad); }
    #panel .timeline { font-size: 12px; line-height: 1.55; }
    #panel .timeline li { margin-bottom: 6px; }
    #panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    #panel .chip {
      font-size: 11px; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--border);
      background: #f7fafc; cursor: pointer;
    }
    #panel .chip.active { background: #d9eef3; border-color: var(--accent); color: var(--accent); font-weight: 650; }
    #panel .chip:hover { border-color: var(--accent); }
    #panel .util { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel .util i {
      font-style: normal; font-size: 11px; padding: 3px 8px; border-radius: 6px;
      background: #eef5fa; border: 1px solid var(--border);
    }
    @media (max-width: 900px) {
      #panel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 12; width: min(360px, 92vw); }
      #badge { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="wrap">
      <div id="loading">
        <div id="load-text">Downloading Intel city…</div>
        <div id="bar"><i id="bar-fill"></i></div>
      </div>
      <div id="hud">
        <h1>Intel City — 3D ULPIN Twin</h1>
        <div class="sub">
          Scroll to zoom · drag orbit · right-drag pan · hover shows footprint.
          <br/>Keys: <kbd>+</kbd>/<kbd>−</kbd> zoom · <kbd>R</kbd> reset · <kbd>Esc</kbd> close
        </div>
        <div id="controls">
          <button id="btn-reset" class="primary" type="button">Reset view</button>
          <button id="btn-zoom-out" type="button" title="Zoom out">Zoom −</button>
          <button id="btn-zoom-in" type="button" title="Zoom in">Zoom +</button>
          <button id="btn-top" type="button" title="Top-down overview">Top view</button>
        </div>
      </div>
      <div id="badge"><b>Loading</b>…</div>
      <div id="tooltip"></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>

  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="./intel_city_app.js?v=10"></script>
</body>
</html>
